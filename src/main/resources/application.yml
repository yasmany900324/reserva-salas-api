server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: reserva-salas-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/reservas}
    username: ${DB_USER:reservas}
    password: ${DB_PASSWORD:reservas}
  jpa:
    # El esquema lo gestiona Flyway; Hibernate solo valida que las entidades encajen
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        # Páginas como {content, page: {size, number, totalElements, totalPages}}
        serialization-mode: via-dto

app:
  seguridad:
    # Valores por defecto SOLO para desarrollo local, para que la app arranque sin configurar nada.
    # Fuera de local hay que definir AUTH_USER, AUTH_PASSWORD y JWT_SECRET (mínimo 32 caracteres).
    usuario: ${AUTH_USER:admin}
    password: ${AUTH_PASSWORD:admin123}
    jwt:
      secreto: ${JWT_SECRET:clave-de-desarrollo-local-no-usar-en-produccion}
      expiracion: ${JWT_EXPIRATION:1h}
